openapi: 3.1.0
info:
  title: wonderlic-calc backend (scaffolding)
  version: 0.1.0
  description: >
    Operational endpoints only for this feature. Calculation endpoints are
    intentionally deferred to a later feature (v1 computes client-side).
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
              example:
                status: ok
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        "200":
          description: Service is ready to serve traffic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
              example:
                status: ready
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ready:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
