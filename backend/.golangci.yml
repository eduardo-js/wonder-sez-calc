version: "2"

linters:
  default: none
  enable:
    - errcheck       # report unchecked errors
    - gosimple       # simplification suggestions
    - govet          # go vet checks
    - ineffassign    # detect ineffectual assignments
    - staticcheck    # static analysis
    - unused         # detect unused code
    - gofmt          # formatting
    - goimports      # import grouping / formatting
    - misspell       # spelling in comments/strings
    - noctx          # detect http requests without context
    - bodyclose      # detect unclosed http response bodies
    - exhaustive     # exhaustive switch/select on enums
    - godot          # comments should end with a period
    - revive         # general linter (replaces golint)

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: github.com/wonderlic-calc/backend
  misspell:
    locale: US
  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  exclude-rules:
    # Test files: relax some rules.
    - path: "_test\\.go"
      linters:
        - godot
        - exhaustive
