# wonderlic-calc local development stack.
# All configuration is inline below — there is intentionally NO .env file.
# The browser runs on the host and calls the host-mapped backend port directly,
# so VITE_API_BASE_URL points at localhost:8080 and the backend must allow the
# frontend's host origin via CORS_ALLOWED_ORIGINS.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:8080"
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Bind-mount source for live HMR; keep container-installed node_modules.
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
